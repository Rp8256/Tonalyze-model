name: Lint

on:
  push:
  pull_request:

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Run clang-tidy
        run: |
          FILES=$(find . -name "*.cpp")
          echo "Found files: $FILES"
          clang-tidy $FILES -- -std=c++17 -I. -Isrc
